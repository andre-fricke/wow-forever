name: Addon backup tests
on:
  push:
    paths: ['tools/addon-backup/**', 'addon/RestedXPTextOnly/**', '.github/workflows/addon-backup.yml']
  pull_request:
    paths: ['tools/addon-backup/**', 'addon/RestedXPTextOnly/**', '.github/workflows/addon-backup.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Build Lua 5.1 for semantics tests
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location https://www.lua.org/ftp/lua-5.1.5.tar.gz -o lua-5.1.5.tar.gz
          echo '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  lua-5.1.5.tar.gz' | shasum -a 256 -c -
          tar -xzf lua-5.1.5.tar.gz
          make -C lua-5.1.5/src generic
          echo "LUA_RUNTIME=$RUNNER_TEMP/lua-5.1.5/src/lua" >> "$GITHUB_ENV"
      - run: python -B tools/addon-backup/run_tests.py --require-lua
